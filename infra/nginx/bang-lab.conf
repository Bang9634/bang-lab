# HTTP bootstrap template. Set the real domain and deploy only dist/ contents.
# Add HTTPS and an HTTP-to-HTTPS redirect before the public launch.
server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    root /var/www/bang-lab/current;
    index index.html;
    server_tokens off;
    autoindex off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Keep certificate challenge files accessible during HTTPS setup.
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    # Block dotfiles even if they are accidentally copied into the web root.
    location ~ /\. {
        deny all;
    }

    # Astro assets have content hashes; HTML must revalidate after a release.
    location /_astro/ {
        try_files $uri =404;
        expires 1y;
    }

    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        expires -1;
    }
}
